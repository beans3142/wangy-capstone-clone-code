server:
  port: 8083

spring:
  application:
    name: image-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  zipkin:
    base-url: http://${ZIPKIN_HOST:localhost}:9411

eureka:
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka

image-service:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:wangyu-dev}
    secret-key: ${S3_SECRET_KEY:wangyu-dev-secret}
    bucket: ${S3_BUCKET:wangyu-images}
  upload:
    max-file-size-bytes: 10485760
