server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
  zipkin:
    base-url: http://${ZIPKIN_HOST:localhost}:9411

eureka:
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-shared-secret-please-override-in-config-server-2026}
    free-paths:
      - /actuator/**
      - /api/v1/auth/login
      - /api/v1/auth/signup
      - /api/v1/auth/activate/**
