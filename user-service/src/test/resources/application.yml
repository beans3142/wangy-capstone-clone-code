spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:5433}/user-test
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-only-secret-key-used-for-user-service-unit-tests-2026-abc
    expiration-millis: 3600000

user-service:
  kafka:
    user-registered-topic: user-registered
